plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain { languageVersion = JavaLanguageVersion.of(java_version as int) } }
repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; gameDirectory = file('run/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', mod_id }
    }
    mods { aeautopatterns { sourceSet sourceSets.main } }
}
dependencies {
    implementation "maven.modrinth:ae2:${ae2_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }

tasks.register('analysisBenchmark', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.likeazusa2.aeautopatterns.logic.AnalysisBenchmark'
    maxHeapSize = '1G'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations { gameTestImplementation.extendsFrom implementation; gameTestRuntimeOnly.extendsFrom runtimeOnly }
neoForge { addModdingDependenciesTo(sourceSets.gameTest); mods { aeautopatterns { sourceSet sourceSets.gameTest } } }

def modMetadata = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_license: mod_license,
    minecraft_version_range: minecraft_version_range,
    loader_version_range: loader_version_range,
    neo_version: neo_version,
    ae2_version_range: ae2_version_range,
    guideme_version_range: guideme_version_range,
    jei_version_range: jei_version_range
]
tasks.withType(ProcessResources).configureEach {
    inputs.properties(modMetadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(modMetadata) }
}
